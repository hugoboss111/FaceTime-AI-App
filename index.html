<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FaceTime</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
–bg: #0a0a0f;
–glass: rgba(255,255,255,0.06);
–glass-border: rgba(255,255,255,0.12);
–accent: #34c759;
–accent-red: #ff3b30;
–accent-blue: #0a84ff;
–text: #ffffff;
–text-dim: rgba(255,255,255,0.5);
–blur: blur(20px);
}

html, body {
width: 100%; height: 100%;
background: var(–bg);
font-family: -apple-system, ‘SF Pro Display’, BlinkMacSystemFont, sans-serif;
overflow: hidden;
color: var(–text);
touch-action: none;
}

/* ── SCREENS ── */
.screen {
position: fixed; inset: 0;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1);
}
.screen.hidden { opacity: 0; pointer-events: none; }

/* ── START SCREEN ── */
#startScreen {
background: radial-gradient(ellipse 80% 60% at 50% 60%, #0d1a2e 0%, #0a0a0f 100%);
z-index: 10;
}

.start-avatar {
width: 96px; height: 96px;
border-radius: 50%;
background: linear-gradient(135deg, #1c3a5c, #0d1a2e);
border: 2.5px solid var(–glass-border);
display: flex; align-items: center; justify-content: center;
font-size: 40px;
margin-bottom: 18px;
box-shadow: 0 0 40px rgba(52,199,89,0.15), 0 8px 32px rgba(0,0,0,0.5);
animation: avatar-pulse 3s ease-in-out infinite;
}
@keyframes avatar-pulse {
0%,100% { box-shadow: 0 0 40px rgba(52,199,89,0.15), 0 8px 32px rgba(0,0,0,0.5); }
50% { box-shadow: 0 0 60px rgba(52,199,89,0.3), 0 8px 32px rgba(0,0,0,0.5); }
}

.start-name {
font-size: 28px; font-weight: 600;
letter-spacing: -0.5px;
margin-bottom: 6px;
}
.start-status {
font-size: 15px; color: var(–text-dim);
margin-bottom: 60px;
}

.call-btn {
width: 72px; height: 72px;
border-radius: 50%;
background: var(–accent);
border: none;
display: flex; align-items: center; justify-content: center;
cursor: pointer;
box-shadow: 0 0 0 0 rgba(52,199,89,0.4);
animation: ring-pulse 2s ease-out infinite;
transition: transform 0.15s;
}
.call-btn:active { transform: scale(0.92); }
@keyframes ring-pulse {
0% { box-shadow: 0 0 0 0 rgba(52,199,89,0.5); }
70% { box-shadow: 0 0 0 22px rgba(52,199,89,0); }
100% { box-shadow: 0 0 0 0 rgba(52,199,89,0); }
}
.call-btn svg { width: 32px; height: 32px; fill: white; }
.call-label {
margin-top: 12px;
font-size: 13px; color: var(–text-dim);
letter-spacing: 0.3px;
}

/* ── CALL SCREEN ── */
#callScreen {
background: #05050a;
z-index: 5;
}

#threeCanvas {
position: fixed; inset: 0;
z-index: 0;
}

/* Top bar */
.call-topbar {
position: fixed; top: 0; left: 0; right: 0;
padding: env(safe-area-inset-top, 44px) 20px 0;
display: flex; align-items: flex-start; justify-content: space-between;
z-index: 20;
}
.call-info { display: flex; flex-direction: column; gap: 3px; }
.call-name { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
.call-duration {
font-size: 14px; color: var(–text-dim);
font-variant-numeric: tabular-nums;
}

/* Camera preview */
.camera-preview {
width: 88px; height: 120px;
border-radius: 14px;
overflow: hidden;
border: 1.5px solid rgba(255,255,255,0.2);
box-shadow: 0 4px 24px rgba(0,0,0,0.6);
background: #111;
position: relative;
}
.camera-preview video {
width: 100%; height: 100%;
object-fit: cover;
transform: scaleX(-1);
}
.camera-off-placeholder {
width: 100%; height: 100%;
display: flex; align-items: center; justify-content: center;
background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
font-size: 28px;
}

/* Status badge */
.status-badge {
position: fixed; top: 50%; left: 50%;
transform: translate(-50%, -50%);
z-index: 20;
background: rgba(0,0,0,0.65);
backdrop-filter: var(–blur);
-webkit-backdrop-filter: var(–blur);
border: 1px solid var(–glass-border);
border-radius: 20px;
padding: 10px 22px;
font-size: 16px; font-weight: 500;
letter-spacing: -0.2px;
transition: opacity 0.4s;
pointer-events: none;
}
.status-badge.hidden { opacity: 0; }

/* Subtitle / transcript */
.subtitle-bar {
position: fixed;
bottom: 160px; left: 24px; right: 24px;
z-index: 20;
text-align: center;
}
.subtitle-text {
display: inline-block;
background: rgba(0,0,0,0.55);
backdrop-filter: var(–blur);
-webkit-backdrop-filter: var(–blur);
border-radius: 12px;
padding: 8px 16px;
font-size: 15px; line-height: 1.4;
color: rgba(255,255,255,0.9);
max-width: 100%;
opacity: 0;
transform: translateY(6px);
transition: opacity 0.3s, transform 0.3s;
}
.subtitle-text.visible {
opacity: 1; transform: translateY(0);
}

/* Mic indicator */
.mic-indicator {
position: fixed;
bottom: 150px; left: 50%; transform: translateX(-50%);
z-index: 20;
display: flex; align-items: center; gap: 8px;
background: rgba(0,0,0,0.5);
backdrop-filter: var(–blur);
-webkit-backdrop-filter: var(–blur);
border-radius: 20px;
padding: 6px 14px;
font-size: 13px; color: var(–text-dim);
opacity: 0;
transition: opacity 0.3s;
}
.mic-indicator.active { opacity: 1; }
.mic-dot {
width: 8px; height: 8px;
border-radius: 50%;
background: var(–accent-red);
animation: mic-blink 1s ease-in-out infinite;
}
@keyframes mic-blink {
0%,100% { opacity: 1; } 50% { opacity: 0.3; }
}

/* Bottom controls */
.call-controls {
position: fixed; bottom: 0; left: 0; right: 0;
padding: 24px 48px calc(env(safe-area-inset-bottom, 20px) + 24px);
display: flex; align-items: center; justify-content: space-around;
z-index: 20;
}

.ctrl-btn {
width: 58px; height: 58px;
border-radius: 50%;
border: none;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
flex-direction: column;
gap: 5px;
transition: transform 0.15s, background 0.2s;
-webkit-user-select: none;
}
.ctrl-btn:active { transform: scale(0.88); }
.ctrl-btn svg { width: 22px; height: 22px; }
.ctrl-btn span { font-size: 11px; color: var(–text-dim); position: absolute; bottom: -18px; white-space: nowrap; }
.ctrl-btn-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.ctrl-label { font-size: 11.5px; color: rgba(255,255,255,0.5); margin-top: 2px; }

.ctrl-mute { background: var(–glass); backdrop-filter: var(–blur); -webkit-backdrop-filter: var(–blur); border: 1px solid var(–glass-border); }
.ctrl-mute.active { background: rgba(255,255,255,0.85); }
.ctrl-mute.active svg { fill: #000 !important; }

.ctrl-speaker { background: var(–glass); backdrop-filter: var(–blur); -webkit-backdrop-filter: var(–blur); border: 1px solid var(–glass-border); }

.ctrl-end {
width: 68px; height: 68px;
background: var(–accent-red);
box-shadow: 0 4px 24px rgba(255,59,48,0.4);
}
.ctrl-end svg { width: 26px; height: 26px; fill: white; transform: rotate(135deg); }

/* Connecting overlay */
#connectingOverlay {
position: fixed; inset: 0; z-index: 30;
background: radial-gradient(ellipse 80% 60% at 50% 55%, #0d1a2e 0%, #05050a 100%);
display: flex; flex-direction: column;
align-items: center; justify-content: center;
gap: 16px;
transition: opacity 0.6s;
}
#connectingOverlay.fade-out { opacity: 0; pointer-events: none; }
.conn-avatar {
width: 110px; height: 110px;
border-radius: 50%;
background: linear-gradient(135deg, #1c3a5c, #0d1a2e);
border: 2.5px solid var(–glass-border);
display: flex; align-items: center; justify-content: center;
font-size: 48px;
box-shadow: 0 0 60px rgba(10,132,255,0.25);
animation: conn-pulse 1.4s ease-in-out infinite;
}
@keyframes conn-pulse {
0%,100% { box-shadow: 0 0 40px rgba(10,132,255,0.2); }
50% { box-shadow: 0 0 80px rgba(10,132,255,0.45); }
}
.conn-name { font-size: 26px; font-weight: 600; }
.conn-status { font-size: 16px; color: var(–text-dim); }
.conn-dots { display: flex; gap: 6px; margin-top: 4px; }
.conn-dot {
width: 7px; height: 7px; border-radius: 50%;
background: var(–text-dim);
animation: dot-bounce 1.2s ease-in-out infinite;
}
.conn-dot:nth-child(2) { animation-delay: 0.2s; }
.conn-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-bounce {
0%,80%,100% { transform: scale(0.7); opacity: 0.4; }
40% { transform: scale(1); opacity: 1; }
}

/* Ringtone visual */
.ring-rings {
position: absolute;
width: 110px; height: 110px;
border-radius: 50%;
}
.ring-ring {
position: absolute; inset: 0;
border-radius: 50%;
border: 2px solid rgba(10,132,255,0.3);
animation: ring-expand 2s ease-out infinite;
}
.ring-ring:nth-child(2) { animation-delay: 0.5s; }
.ring-ring:nth-child(3) { animation-delay: 1s; }
@keyframes ring-expand {
0% { transform: scale(1); opacity: 0.6; }
100% { transform: scale(2.8); opacity: 0; }
}

/* Ended overlay */
#endedOverlay {
position: fixed; inset: 0; z-index: 40;
background: rgba(5,5,10,0.95);
display: flex; flex-direction: column;
align-items: center; justify-content: center;
gap: 12px;
opacity: 0; pointer-events: none;
transition: opacity 0.4s;
}
#endedOverlay.show { opacity: 1; pointer-events: all; }
.ended-icon { font-size: 52px; margin-bottom: 6px; }
.ended-title { font-size: 22px; font-weight: 600; }
.ended-sub { font-size: 15px; color: var(–text-dim); }
.ended-btn {
margin-top: 28px;
padding: 14px 44px;
border-radius: 50px;
background: var(–glass);
backdrop-filter: var(–blur);
-webkit-backdrop-filter: var(–blur);
border: 1px solid var(–glass-border);
color: white; font-size: 16px; font-weight: 500;
cursor: pointer;
transition: background 0.2s, transform 0.15s;
}
.ended-btn:active { transform: scale(0.95); }
</style>

</head>

<script>
const API_KEY = "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";

// ── STATE ──
var callActive = false;
var muted = false;
var callStartTime = null;
var durationInterval = null;
var recognition = null;
var isSpeaking = false;
var isListening = false;
var aiSpeaking = false;
var conversationHistory = [];
var orbState = 'idle'; // idle | listening | speaking
var audioCtx = null;
var analyser = null;
var micStream = null;
var orbVolume = 0;

// ── THREE.JS ORB ──
var scene, camera, renderer, particles, particlePositions, particleVelocities;
var orbClock = new THREE.Clock();
var PARTICLE_COUNT = 1800;

function initThree() {
  var canvas = document.getElementById('threeCanvas');
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 3.2;

  // Build particle sphere
  var geo = new THREE.BufferGeometry();
  var positions = new Float32Array(PARTICLE_COUNT * 3);
  var colors = new Float32Array(PARTICLE_COUNT * 3);
  particlePositions = new Float32Array(PARTICLE_COUNT * 3);
  particleVelocities = new Float32Array(PARTICLE_COUNT * 3);

  for (var i = 0; i < PARTICLE_COUNT; i++) {
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    var r = 1.0 + (Math.random() - 0.5) * 0.12;
    var x = r * Math.sin(phi) * Math.cos(theta);
    var y = r * Math.sin(phi) * Math.sin(theta);
    var z = r * Math.cos(phi);
    positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
    particlePositions[i*3] = x; particlePositions[i*3+1] = y; particlePositions[i*3+2] = z;
    particleVelocities[i*3] = (Math.random()-0.5)*0.001;
    particleVelocities[i*3+1] = (Math.random()-0.5)*0.001;
    particleVelocities[i*3+2] = (Math.random()-0.5)*0.001;

    // Color: gradient from teal-blue to green
    var t = Math.random();
    colors[i*3]   = 0.05 + t * 0.1;   // R
    colors[i*3+1] = 0.5  + t * 0.3;   // G
    colors[i*3+2] = 0.8  - t * 0.3;   // B
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  var mat = new THREE.PointsMaterial({
    size: 0.022,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true
  });

  particles = new THREE.Points(geo, mat);
  scene.add(particles);

  // Ambient glow sphere
  var glowGeo = new THREE.SphereGeometry(1.05, 32, 32);
  var glowMat = new THREE.MeshBasicMaterial({
    color: 0x00cc66,
    transparent: true,
    opacity: 0.04,
    side: THREE.BackSide
  });
  var glow = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glow);

  window.addEventListener('resize', onResize);
  animateOrb();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animateOrb() {
  requestAnimationFrame(animateOrb);
  var t = orbClock.getElapsedTime();
  var pos = particles.geometry.attributes.position.array;

  // Target scale based on state
  var targetScale = 1.0;
  if (orbState === 'idle') targetScale = 1.0 + Math.sin(t * 0.7) * 0.03;
  else if (orbState === 'listening') targetScale = 1.0 + Math.sin(t * 2.5) * 0.05 + orbVolume * 0.12;
  else if (orbState === 'speaking') targetScale = 1.0 + Math.sin(t * 6) * 0.08 + orbVolume * 0.2;

  // Smooth volume decay
  orbVolume *= 0.92;

  for (var i = 0; i < PARTICLE_COUNT; i++) {
    var ox = particlePositions[i*3];
    var oy = particlePositions[i*3+1];
    var oz = particlePositions[i*3+2];

    // Noise-like movement
    var noise = Math.sin(t * 0.8 + i * 0.05) * 0.008;
    var nx = ox + noise * Math.cos(i);
    var ny = oy + noise * Math.sin(i * 0.7);
    var nz = oz + noise * Math.cos(i * 1.3);

    pos[i*3]   = nx * targetScale;
    pos[i*3+1] = ny * targetScale;
    pos[i*3+2] = nz * targetScale;
  }

  particles.geometry.attributes.position.needsUpdate = true;

  // Slow rotation
  particles.rotation.y = t * 0.18;
  particles.rotation.x = Math.sin(t * 0.12) * 0.1;

  renderer.render(scene, camera);
}

// ── AUDIO ANALYSIS ──
function setupAudioAnalyser(stream) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    var source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    tickAnalyser();
  } catch(e) {}
}

function tickAnalyser() {
  if (!analyser) return;
  requestAnimationFrame(tickAnalyser);
  var data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  var sum = 0;
  for (var i = 0; i < data.length; i++) sum += data[i];
  var avg = sum / data.length / 128;
  if (orbState === 'listening') orbVolume = Math.max(orbVolume, avg * 0.6);
}

// ── RINGTONE (generated) ──
var ringAudio = null;
function playRingtone() {
  try {
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    var notes = [523, 659, 784, 1047];
    var noteIdx = 0;
    function playNote() {
      if (!ringAudio) return;
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.frequency.value = notes[noteIdx % notes.length];
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ac.currentTime);
      gain.gain.linearRampToValueAtTime(0.15, ac.currentTime + 0.05);
      gain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.3);
      osc.start(ac.currentTime);
      osc.stop(ac.currentTime + 0.32);
      noteIdx++;
      if (ringAudio) ringAudio.timer = setTimeout(playNote, 380);
    }
    ringAudio = { timer: null, ac: ac };
    playNote();
  } catch(e) {}
}

function stopRingtone() {
  if (ringAudio) {
    clearTimeout(ringAudio.timer);
    try { ringAudio.ac.close(); } catch(e) {}
    ringAudio = null;
  }
}

// ── CALL FLOW ──
function startCall() {
  document.getElementById('startScreen').classList.add('hidden');
  var conn = document.getElementById('connectingOverlay');
  conn.style.display = 'flex';
  conn.classList.remove('hidden');
  playRingtone();

  // Get camera
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
    .then(function(stream) {
      micStream = stream;
      var video = document.getElementById('cameraVideo');
      video.srcObject = stream;
      setupAudioAnalyser(stream);
    })
    .catch(function() {
      document.getElementById('cameraVideo').style.display = 'none';
      document.getElementById('cameraPlaceholder').style.display = 'flex';
    });

  setTimeout(function() {
    stopRingtone();
    conn.classList.add('fade-out');
    setTimeout(function() {
      conn.style.display = 'none';
      showCallScreen();
    }, 600);
  }, 1800);
}

function showCallScreen() {
  var callScreen = document.getElementById('callScreen');
  callScreen.classList.remove('hidden');
  callActive = true;
  callStartTime = Date.now();

  durationInterval = setInterval(updateDuration, 1000);
  initThree();

  // AI says first line
  setTimeout(function() {
    speakAI("yo— what's up bro… can you hear me?");
  }, 400);
}

function updateDuration() {
  if (!callStartTime) return;
  var elapsed = Math.floor((Date.now() - callStartTime) / 1000);
  var m = Math.floor(elapsed / 60);
  var s = elapsed % 60;
  document.getElementById('callDuration').textContent =
    (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function endCall() {
  callActive = false;
  clearInterval(durationInterval);
  stopRecognition();
  window.speechSynthesis.cancel();
  if (micStream) {
    micStream.getTracks().forEach(function(t) { t.stop(); });
  }
  var dur = document.getElementById('callDuration').textContent;
  document.getElementById('endedDuration').textContent = dur;
  document.getElementById('endedOverlay').classList.add('show');
}

function resetApp() {
  location.reload();
}

// ── SPEECH RECOGNITION ──
function startRecognition() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showSubtitle("(mic not supported — type to chat)"); return; }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    isListening = true;
    orbState = 'listening';
    document.getElementById('micIndicator').classList.add('active');
  };

  recognition.onresult = function(e) {
    var transcript = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    showSubtitle('You: ' + transcript, true);
    if (e.results[e.results.length-1].isFinal) {
      hideSubtitle();
      document.getElementById('micIndicator').classList.remove('active');
      orbState = 'idle';
      handleUserSpeech(transcript.trim());
    }
  };

  recognition.onerror = function(e) {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      console.log('STT error:', e.error);
    }
    orbState = 'idle';
    document.getElementById('micIndicator').classList.remove('active');
    isListening = false;
    if (callActive && !aiSpeaking) setTimeout(startRecognition, 600);
  };

  recognition.onend = function() {
    isListening = false;
    orbState = 'idle';
    document.getElementById('micIndicator').classList.remove('active');
    if (callActive && !aiSpeaking) setTimeout(startRecognition, 600);
  };

  try { recognition.start(); }
  catch(e) {}
}

function stopRecognition() {
  if (recognition) {
    try { recognition.abort(); } catch(e) {}
    recognition = null;
  }
  isListening = false;
}

// ── AI RESPONSE ──
async function handleUserSpeech(text) {
  if (!text || !callActive) return;
  aiSpeaking = true;
  stopRecognition();

  conversationHistory.push({ role: 'user', content: text });

  // Random human delay
  var delay = 400 + Math.random() * 800;

  // Occasional interruptions
  var quirks = Math.random();
  if (quirks < 0.1) {
    await sleep(300);
    speakAI("wait— what?");
    await sleep(900);
  } else if (quirks < 0.15) {
    await sleep(200);
    speakAI("hm…");
    await sleep(600);
  }

  await sleep(delay);

  try {
    var response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 120,
        system: "You are a real person on a live FaceTime video call. Speak casually, messy, short, slightly chaotic, like a teenager. Use filler words like 'bro', 'lowkey', 'fr', 'ngl', 'wait', 'like', 'uhh', contractions. Add interruptions and quick reactions. Keep responses 1–2 sentences max. Never sound formal or AI-like. Be reactive and natural.",
        messages: conversationHistory
      })
    });

    var data = await response.json();
    var reply = data.content && data.content[0] ? data.content[0].text : "wait that's kinda wild ngl";
    conversationHistory.push({ role: 'assistant', content: reply });
    speakAI(reply);
  } catch(e) {
    speakAI("bro my connection's being weird lol— what were u saying");
    aiSpeaking = false;
    if (callActive) setTimeout(startRecognition, 800);
  }
}

// ── TEXT TO SPEECH ──
function speakAI(text) {
  if (!callActive) return;
  aiSpeaking = true;
  orbState = 'speaking';
  window.speechSynthesis.cancel();

  showSubtitle('Alex: ' + text);

  // Split into chunks for naturalness
  var chunks = splitIntoChunks(text);
  var idx = 0;

  function speakNext() {
    if (!callActive || idx >= chunks.length) {
      orbState = 'idle';
      aiSpeaking = false;
      hideSubtitle();
      if (callActive) setTimeout(startRecognition, 500);
      return;
    }
    var chunk = chunks[idx++];
    var utt = new SpeechSynthesisUtterance(chunk);
    utt.rate = 0.95 + Math.random() * 0.15;
    utt.pitch = 1.0 + Math.random() * 0.1;

    // Pick a voice
    var voices = window.speechSynthesis.getVoices();
    var preferred = voices.find(function(v) {
      return v.lang === 'en-US' && (v.name.includes('Alex') || v.name.includes('Aaron') || v.name.includes('Fred'));
    });
    if (!preferred) preferred = voices.find(function(v) { return v.lang.startsWith('en'); });
    if (preferred) utt.voice = preferred;

    utt.onboundary = function(e) {
      // Pulse orb on word boundary
      orbVolume = Math.max(orbVolume, 0.4 + Math.random() * 0.3);
    };

    utt.onend = function() {
      var pause = 60 + Math.random() * 120;
      setTimeout(speakNext, pause);
    };

    utt.onerror = function() { speakNext(); };

    window.speechSynthesis.speak(utt);
    orbVolume = 0.5;
  }

  speakNext();
}

function splitIntoChunks(text) {
  // Split on sentence boundaries and filler points
  var chunks = text.split(/(?<=[.!?,…—])\s+/);
  if (chunks.length === 1 && text.length > 40) {
    // Split at mid-word filler
    chunks = text.split(/\s+(like|uh|uhh|wait|bro|ok|okay|ngl|fr|so)\s+/i);
  }
  return chunks.filter(function(c) { return c.trim().length > 0; });
}

// ── SUBTITLE ──
var subtitleTimeout = null;
function showSubtitle(text, interim) {
  var el = document.getElementById('subtitleText');
  el.textContent = text;
  el.classList.add('visible');
  if (!interim) {
    clearTimeout(subtitleTimeout);
    subtitleTimeout = setTimeout(hideSubtitle, 4000);
  }
}

function hideSubtitle() {
  var el = document.getElementById('subtitleText');
  el.classList.remove('visible');
}

// ── CONTROLS ──
function toggleMute() {
  muted = !muted;
  var btn = document.getElementById('muteBtn');
  if (muted) {
    btn.classList.add('active');
    btn.querySelector('svg').innerHTML = '<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V20c0 .55.45 1 1 1s1-.45 1-1v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>';
    if (micStream) micStream.getAudioTracks().forEach(function(t) { t.enabled = false; });
    if (recognition) stopRecognition();
  } else {
    btn.classList.remove('active');
    btn.querySelector('svg').innerHTML = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>';
    if (micStream) micStream.getAudioTracks().forEach(function(t) { t.enabled = true; });
    if (!aiSpeaking) startRecognition();
  }
}

var speakerLoud = true;
function toggleSpeaker() {
  speakerLoud = !speakerLoud;
  var btn = document.getElementById('speakerBtn');
  if (!speakerLoud) {
    btn.style.background = 'rgba(255,255,255,0.15)';
    btn.querySelector('svg').innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
  } else {
    btn.style.background = '';
    btn.querySelector('svg').innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }
}

// ── UTILS ──
function sleep(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

// Load voices on init
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
}
