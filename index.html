<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Call</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg: #000000;
  --surface: rgba(255,255,255,0.06);
  --surface-hover: rgba(255,255,255,0.12);
  --text: #ffffff;
  --text-dim: rgba(255,255,255,0.5);
  --green: #34c759;
  --red: #ff3b30;
  --glow-green: rgba(52,199,89,0.3);
  --glow-red: rgba(255,59,48,0.3);
  --glow-blue: rgba(10,132,255,0.25);
}
html, body {
  width:100%; height:100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
#app {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  position:relative;
}

/* Camera Preview */
#camera-wrap {
position:absolute; top: max(env(safe-area-inset-top), 16px); right:16px;
width:90px; height:120px;
border-radius:16px; overflow:hidden;
border: 2px solid rgba(255,255,255,0.15);
z-index:20; opacity:0;
transition: opacity 0.6s ease;
background: #111;
}
#camera-wrap.visible { opacity:1; }
#camera-preview {
width:100%; height:100%;
object-fit:cover;
transform: scaleX(-1);
}

/* Three.js Canvas */
#orb-canvas {
position:absolute; top:0; left:0;
width:100%; height:100%;
z-index:1;
}

/* Status / Labels */
#status-area {
position:absolute;
top: calc(max(env(safe-area-inset-top), 16px) + 20px);
left:0; width:100%;
text-align:center;
z-index:10;
pointer-events:none;
}
#caller-name {
font-size:20px; font-weight:600;
letter-spacing:-0.3px;
opacity:0; transition: opacity 0.5s ease;
}
#caller-name.visible { opacity:1; }
#call-status {
font-size:13px; font-weight:400;
color: var(–text-dim);
margin-top:4px;
opacity:0; transition: opacity 0.5s ease;
letter-spacing:0.2px;
}
#call-status.visible { opacity:1; }

/* Transcript */
#transcript-area {
position:absolute;
bottom:160px; left:20px; right:20px;
text-align:center;
z-index:10;
pointer-events:none;
}
#transcript-text {
font-size:15px; font-weight:400;
color: rgba(255,255,255,0.7);
line-height:1.4;
max-height:80px; overflow:hidden;
transition: opacity 0.3s ease;
}

/* Controls */
#controls {
position:absolute;
bottom: max(env(safe-area-inset-bottom, 0px), 24px);
left:0; width:100%;
display:flex; justify-content:center;
align-items:center; gap:60px;
z-index:10;
padding-bottom:16px;
}

.ctrl-btn {
width:64px; height:64px;
border-radius:50%;
border:none; outline:none;
display:flex; align-items:center; justify-content:center;
cursor:pointer;
transition: transform 0.2s ease, box-shadow 0.3s ease, opacity 0.3s ease;
-webkit-tap-highlight-color: transparent;
}
.ctrl-btn:active { transform:scale(0.9); }
.ctrl-btn svg { width:28px; height:28px; }

#btn-call {
background: var(–green);
box-shadow: 0 0 30px var(–glow-green);
}
#btn-end {
background: var(–red);
box-shadow: 0 0 30px var(–glow-red);
display:none;
}
#btn-mute {
background: var(–surface);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
display:none;
}

/* Start screen */
#start-screen {
position:absolute; top:0; left:0;
width:100%; height:100%;
display:flex; flex-direction:column;
align-items:center; justify-content:center;
z-index:15;
transition: opacity 0.5s ease;
}
#start-screen.hidden { opacity:0; pointer-events:none; }
#start-avatar {
width:100px; height:100px;
border-radius:50%;
background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
display:flex; align-items:center; justify-content:center;
margin-bottom:16px;
box-shadow: 0 0 60px rgba(10,132,255,0.15);
}
#start-avatar svg { width:48px; height:48px; fill:rgba(255,255,255,0.7); }
#start-name { font-size:26px; font-weight:600; letter-spacing:-0.5px; margin-bottom:4px; }
#start-sub { font-size:14px; color:var(–text-dim); margin-bottom:48px; }

/* Timer */
#call-timer {
font-size:13px;
color: var(–text-dim);
font-variant-numeric: tabular-nums;
letter-spacing:0.5px;
}

/* Listening indicator */
#listening-dot {
position:absolute;
top: calc(max(env(safe-area-inset-top), 16px) + 70px);
left:50%; transform:translateX(-50%);
width:8px; height:8px;
border-radius:50%;
background: var(–green);
z-index:10;
opacity:0;
transition: opacity 0.3s ease;
box-shadow: 0 0 12px var(–glow-green);
}
#listening-dot.active {
opacity:1;
animation: pulse-dot 1.5s ease infinite;
}
@keyframes pulse-dot {
0%,100% { transform:translateX(-50%) scale(1); opacity:0.8; }
50% { transform:translateX(-50%) scale(1.4); opacity:1; }
}

/* Ringtone visual */
@keyframes ring-pulse {
0%,100% { box-shadow: 0 0 30px var(–glow-green); }
50% { box-shadow: 0 0 50px var(–glow-green), 0 0 80px rgba(52,199,89,0.15); }
}
.ringing { animation: ring-pulse 1s ease infinite; }

</style>
</head>
<body>
<div id="app">

  <!-- Three.js Orb -->

<canvas id="orb-canvas"></canvas>

  <!-- Camera Preview -->

  <div id="camera-wrap">
    <video id="camera-preview" autoplay playsinline muted></video>

  <!-- Status -->

  <div id="status-area">
    <div id="caller-name">Claude</div>

  </div>

  <!-- Transcript -->

  <div id="transcript-area">
    <div id="transcript-text"></div>

  <!-- Start Screen -->

  <div id="start-screen">
    <div id="start-avatar">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>

      <svg viewBox="0 0 24 24" fill="white"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>

    </button>
    <button class="ctrl-btn" id="btn-end">
      <svg viewBox="0 0 24 24" fill="white"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28a1 1 0 01-.71-.3L.29 13.08a1 1 0 010-1.42C3.55 8.38 7.56 6.5 12 6.5s8.45 1.88 11.71 5.16a1 1 0 010 1.42l-2.48 2.48a1 1 0 01-.7.29c-.27 0-.52-.1-.7-.29a11.27 11.27 0 00-2.67-1.85.99.99 0 01-.56-.9v-3.1A15.9 15.9 0 0012 9z"/></svg>
    </button>
  </div>
</div>

<script>
var API_KEY = "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";

// ─── STATE ──────────────────────────────────────────────
var state = {
  inCall: false,
  isSpeaking: false,
  isListening: false,
  isMuted: false,
  conversationHistory: [],
  timerSeconds: 0,
  timerInterval: null,
  currentUtterances: [],
  audioLevel: 0,
  orbMode: 'idle' // idle | listening | speaking
};

// ─── DOM REFS ───────────────────────────────────────────
var startScreen = document.getElementById('start-screen');
var btnCall = document.getElementById('btn-call');
var btnEnd = document.getElementById('btn-end');
var btnMute = document.getElementById('btn-mute');
var callerName = document.getElementById('caller-name');
var callStatus = document.getElementById('call-status');
var callTimer = document.getElementById('call-timer');
var transcriptText = document.getElementById('transcript-text');
var cameraWrap = document.getElementById('camera-wrap');
var cameraPreview = document.getElementById('camera-preview');
var listeningDot = document.getElementById('listening-dot');
var orbCanvas = document.getElementById('orb-canvas');

// ─── THREE.JS ORB ───────────────────────────────────────
var scene, camera, renderer, particles, particlePositions, particleVelocities;
var orbTargetScale = 1.0;
var orbCurrentScale = 1.0;
var orbBreathPhase = 0;
var orbNoiseTime = 0;

function initOrb() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 4;

  renderer = new THREE.WebGLRenderer({ canvas: orbCanvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  var count = 2400;
  var geometry = new THREE.BufferGeometry();
  particlePositions = new Float32Array(count * 3);
  particleVelocities = [];

  for (var i = 0; i < count; i++) {
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    var r = 0.9 + Math.random() * 0.1;
    particlePositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    particlePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    particlePositions[i*3+2] = r * Math.cos(phi);
    particleVelocities.push({
      speed: 0.002 + Math.random() * 0.005,
      axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(),
      offset: Math.random() * Math.PI * 2
    });
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

  var material = new THREE.PointsMaterial({
    color: 0x4a9eff,
    size: 0.025,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  particles = new THREE.Points(geometry, material);
  scene.add(particles);

  // Inner glow sphere
  var glowGeo = new THREE.SphereGeometry(0.6, 32, 32);
  var glowMat = new THREE.MeshBasicMaterial({
    color: 0x0a84ff,
    transparent: true,
    opacity: 0.04
  });
  var glowMesh = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glowMesh);

  animateOrb();
}

function animateOrb() {
  requestAnimationFrame(animateOrb);

  var time = Date.now() * 0.001;
  orbBreathPhase += 0.015;
  orbNoiseTime += 0.01;

  // Target scale based on mode
  if (state.orbMode === 'speaking') {
    orbTargetScale = 1.0 + state.audioLevel * 0.5;
  } else if (state.orbMode === 'listening') {
    orbTargetScale = 1.0 + Math.sin(time * 3) * 0.04;
  } else {
    orbTargetScale = 1.0 + Math.sin(orbBreathPhase) * 0.03;
  }

  orbCurrentScale += (orbTargetScale - orbCurrentScale) * 0.12;
  particles.scale.set(orbCurrentScale, orbCurrentScale, orbCurrentScale);

  // Rotate
  var rotSpeed = state.orbMode === 'speaking' ? 0.008 : 0.003;
  particles.rotation.y += rotSpeed;
  particles.rotation.x += rotSpeed * 0.3;

  // Displace particles for speaking
  var positions = particles.geometry.attributes.position.array;
  for (var i = 0; i < particleVelocities.length; i++) {
    var v = particleVelocities[i];
    var idx = i * 3;
    var ox = positions[idx], oy = positions[idx+1], oz = positions[idx+2];
    var len = Math.sqrt(ox*ox + oy*oy + oz*oz);
    if (len === 0) continue;
    var nx = ox/len, ny = oy/len, nz = oz/len;

    var targetR = 0.9;
    if (state.orbMode === 'speaking') {
      targetR = 0.9 + Math.sin(time * 8 + v.offset) * state.audioLevel * 0.2;
    } else if (state.orbMode === 'listening') {
      targetR = 0.9 + Math.sin(time * 2 + v.offset) * 0.02;
    }

    var currentR = len;
    var newR = currentR + (targetR - currentR) * 0.08;
    positions[idx]   = nx * newR;
    positions[idx+1] = ny * newR;
    positions[idx+2] = nz * newR;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  // Color shift
  if (state.orbMode === 'speaking') {
    particles.material.color.lerp(new THREE.Color(0x5ac8fa), 0.05);
    particles.material.opacity = 0.85 + state.audioLevel * 0.15;
  } else if (state.orbMode === 'listening') {
    particles.material.color.lerp(new THREE.Color(0x34c759), 0.03);
    particles.material.opacity = 0.75;
  } else {
    particles.material.color.lerp(new THREE.Color(0x4a9eff), 0.03);
    particles.material.opacity = 0.7;
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', function() {
  if (!camera || !renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── CAMERA ─────────────────────────────────────────────
function startCamera() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 180, height: 240 }, audio: false })
      .then(function(stream) {
        cameraPreview.srcObject = stream;
        cameraWrap.classList.add('visible');
      })
      .catch(function() {
        console.log('Camera not available');
      });
  }
}

// ─── RINGTONE (Web Audio API generated) ─────────────────
var audioCtx;
function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playRingtone(callback) {
  var ctx = ensureAudioCtx();
  var duration = 1.2;
  var osc1 = ctx.createOscillator();
  var osc2 = ctx.createOscillator();
  var gain = ctx.createGain();

  osc1.type = 'sine';
  osc2.type = 'sine';
  osc1.frequency.value = 440;
  osc2.frequency.value = 480;
  gain.gain.value = 0.08;

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);

  // Ring pattern
  var t = ctx.currentTime;
  gain.gain.setValueAtTime(0.08, t);
  gain.gain.setValueAtTime(0, t + 0.4);
  gain.gain.setValueAtTime(0.08, t + 0.6);
  gain.gain.setValueAtTime(0, t + 1.0);

  osc1.start(t);
  osc2.start(t);
  osc1.stop(t + duration);
  osc2.stop(t + duration);

  setTimeout(function() {
    if (callback) callback();
  }, duration * 1000);
}

// ─── SPEECH RECOGNITION ─────────────────────────────────
var recognition;
var recognitionRestarting = false;
var finalTranscript = '';
var silenceTimer = null;
var SILENCE_TIMEOUT = 1800;

function initRecognition() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    console.warn('Speech recognition not supported');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onresult = function(e) {
    if (!state.inCall || state.isMuted) return;

    var interim = '';
    finalTranscript = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var t = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        finalTranscript += t;
      } else {
        interim += t;
      }
    }

    var display = finalTranscript || interim;
    if (display.trim()) {
      transcriptText.textContent = display;
      transcriptText.style.opacity = '1';
      state.orbMode = 'listening';
      listeningDot.classList.add('active');

      // If AI is currently speaking, interrupt it
      if (state.isSpeaking && display.trim().split(' ').length >= 2) {
        interruptAI();
      }
    }

    // Reset silence timer
    clearTimeout(silenceTimer);
    if (finalTranscript.trim()) {
      silenceTimer = setTimeout(function() {
        if (finalTranscript.trim() && !state.isSpeaking && state.inCall) {
          handleUserFinished(finalTranscript.trim());
          finalTranscript = '';
        }
      }, SILENCE_TIMEOUT);
    }
  };

  recognition.onend = function() {
    if (state.inCall && !recognitionRestarting) {
      recognitionRestarting = true;
      setTimeout(function() {
        recognitionRestarting = false;
        if (state.inCall) {
          try { recognition.start(); } catch(e) {}
        }
      }, 100);
    }
  };

  recognition.onerror = function(e) {
    if (e.error === 'not-allowed') {
      callStatus.textContent = 'Mic permission needed';
    }
    if (e.error !== 'aborted' && e.error !== 'no-speech' && state.inCall) {
      setTimeout(function() {
        if (state.inCall) {
          try { recognition.start(); } catch(ex) {}
        }
      }, 300);
    }
  };
}

function startListening() {
  if (!recognition) initRecognition();
  if (!recognition) return;
  try { recognition.start(); } catch(e) {}
  state.isListening = true;
}

function stopListening() {
  state.isListening = false;
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
  clearTimeout(silenceTimer);
  listeningDot.classList.remove('active');
}

// ─── TTS (SpeechSynthesis) ──────────────────────────────
function interruptAI() {
  state.isSpeaking = false;
  state.orbMode = 'listening';
  window.speechSynthesis.cancel();
  state.currentUtterances = [];
}

function speakText(text, onDone) {
  if (!text || !text.trim()) { if (onDone) onDone(); return; }

  // Split into small chunks for realism
  var chunks = splitIntoChunks(text);
  state.isSpeaking = true;
  state.orbMode = 'speaking';

  var idx = 0;
  function speakNext() {
    if (idx >= chunks.length || !state.isSpeaking) {
      state.isSpeaking = false;
      state.orbMode = 'idle';
      state.audioLevel = 0;
      if (onDone) onDone();
      return;
    }

    var chunk = chunks[idx];
    idx++;

    var utter = new SpeechSynthesisUtterance(chunk);
    utter.rate = 0.95 + Math.random() * 0.15;
    utter.pitch = 0.95 + Math.random() * 0.1;
    utter.volume = 1;

    // Try to pick a good voice
    var voices = window.speechSynthesis.getVoices();
    var preferred = null;
    for (var v = 0; v < voices.length; v++) {
      var name = voices[v].name.toLowerCase();
      if (name.indexOf('samantha') > -1 || name.indexOf('alex') > -1 || name.indexOf('daniel') > -1) {
        preferred = voices[v];
        break;
      }
    }
    if (!preferred) {
      for (var v = 0; v < voices.length; v++) {
        if (voices[v].lang.indexOf('en') === 0) {
          preferred = voices[v];
          break;
        }
      }
    }
    if (preferred) utter.voice = preferred;

    utter.onstart = function() {
      state.audioLevel = 0.4 + Math.random() * 0.3;
      transcriptText.textContent = text;
      transcriptText.style.opacity = '0.6';
    };

    utter.onboundary = function() {
      state.audioLevel = 0.3 + Math.random() * 0.5;
    };

    utter.onend = function() {
      state.audioLevel = 0;
      // Small pause between chunks
      var pause = 80 + Math.random() * 200;
      setTimeout(speakNext, pause);
    };

    utter.onerror = function() {
      state.audioLevel = 0;
      speakNext();
    };

    window.speechSynthesis.speak(utter);
  }

  speakNext();
}

function splitIntoChunks(text) {
  // Split on sentence boundaries, commas, dashes, ellipses
  var raw = text.split(/(?<=[.!?…,—–\-])\s+/);
  var chunks = [];
  for (var i = 0; i < raw.length; i++) {
    var c = raw[i].trim();
    if (c) chunks.push(c);
  }
  if (chunks.length === 0) chunks.push(text);
  return chunks;
}

// ─── CLAUDE API ─────────────────────────────────────────
function sendToAI(userText) {
  state.conversationHistory.push({ role: 'user', content: userText });

  // Keep conversation manageable
  if (state.conversationHistory.length > 20) {
    state.conversationHistory = state.conversationHistory.slice(-16);
  }

  callStatus.textContent = 'thinking…';

  var body = {
    model: 'claude-sonnet-4-20250514',
    max_tokens: 200,
    system: "You are a real person on a live phone call. Speak casually, messy, short, slightly chaotic, like a teenager. Use filler words (like, uh, bro, wait, nah, yo, man, lowkey). Keep responses 1-2 sentences max. Sometimes trail off... or interrupt yourself. Never use asterisks or emojis or stage directions. Just talk like a real person would on a phone call. Be natural and conversational - react to what they say, ask follow-ups, joke around.",
    messages: state.conversationHistory
  };

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (!state.inCall) return;

    var reply = '';
    if (data.content && data.content.length > 0) {
      for (var i = 0; i < data.content.length; i++) {
        if (data.content[i].type === 'text') {
          reply += data.content[i].text;
        }
      }
    }

    if (!reply) reply = "wait what? sorry bro i zoned out";

    state.conversationHistory.push({ role: 'assistant', content: reply });
    callStatus.textContent = formatTimer(state.timerSeconds);

    // Human-like delay before responding
    var delay = 400 + Math.random() * 800;

    // Occasionally add a filler before the real response
    var filler = Math.random();
    if (filler < 0.1) {
      speakText("wait—", function() {
        setTimeout(function() { speakText(reply, onAIDone); }, 200);
      });
    } else if (filler < 0.15) {
      speakText("uhh", function() {
        setTimeout(function() { speakText(reply, onAIDone); }, 300);
      });
    } else {
      setTimeout(function() { speakText(reply, onAIDone); }, delay);
    }
  })
  .catch(function(err) {
    console.error('API Error:', err);
    callStatus.textContent = formatTimer(state.timerSeconds);
    speakText("yo my bad, i think we're breaking up or something", onAIDone);
  });
}

function onAIDone() {
  if (!state.inCall) return;
  state.orbMode = 'idle';
  transcriptText.style.opacity = '0.3';
  listeningDot.classList.add('active');
}

function handleUserFinished(text) {
  listeningDot.classList.remove('active');
  state.orbMode = 'idle';
  sendToAI(text);
}

// ─── CALL FLOW ──────────────────────────────────────────
function startCall() {
  state.inCall = true;
  state.conversationHistory = [];

  startScreen.classList.add('hidden');
  callerName.classList.add('visible');
  callStatus.classList.add('visible');
  callStatus.textContent = 'Connecting…';
  btnEnd.style.display = 'flex';
  btnMute.style.display = 'flex';
  btnCall.style.display = 'none';

  startCamera();

  playRingtone(function() {
    if (!state.inCall) return;

    callStatus.textContent = '0:00';
    startTimer();
    listeningDot.classList.add('active');

    // AI opens the call
    var opener = "yo—what's up bro… can you hear me?";
    state.conversationHistory.push({ role: 'assistant', content: opener });

    setTimeout(function() {
      if (!state.inCall) return;
      speakText(opener, function() {
        state.orbMode = 'idle';
        startListening();
      });
    }, 400);
  });
}

function endCall() {
  state.inCall = false;
  state.isSpeaking = false;
  state.orbMode = 'idle';
  state.audioLevel = 0;

  interruptAI();
  stopListening();
  clearInterval(state.timerInterval);

  // Stop camera
  if (cameraPreview.srcObject) {
    var tracks = cameraPreview.srcObject.getTracks();
    for (var i = 0; i < tracks.length; i++) tracks[i].stop();
    cameraPreview.srcObject = null;
  }
  cameraWrap.classList.remove('visible');

  callerName.classList.remove('visible');
  callStatus.classList.remove('visible');
  callTimer.textContent = '';
  transcriptText.textContent = '';
  listeningDot.classList.remove('active');

  btnEnd.style.display = 'none';
  btnMute.style.display = 'none';

  // Return to start
  setTimeout(function() {
    startScreen.classList.remove('hidden');
    btnCall.style.display = 'flex';
    state.timerSeconds = 0;
    state.conversationHistory = [];
  }, 300);
}

function toggleMute() {
  state.isMuted = !state.isMuted;
  if (state.isMuted) {
    btnMute.style.background = 'rgba(255,255,255,0.25)';
    listeningDot.classList.remove('active');
  } else {
    btnMute.style.background = 'var(--surface)';
    listeningDot.classList.add('active');
  }
}

// ─── TIMER ──────────────────────────────────────────────
function startTimer() {
  state.timerSeconds = 0;
  state.timerInterval = setInterval(function() {
    state.timerSeconds++;
    callStatus.textContent = formatTimer(state.timerSeconds);
  }, 1000);
}

function formatTimer(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// ─── SPEECH SYNTHESIS VOICES ────────────────────────────
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.getVoices();
    };
  }
  // iOS Safari fix: keep synth alive
  setInterval(function() {
    if (state.isSpeaking && window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }
  }, 250);
}

// ─── EVENT LISTENERS ────────────────────────────────────
btnCall.addEventListener('click', function() {
  ensureAudioCtx();
  startCall();
});
btnEnd.addEventListener('click', endCall);
btnMute.addEventListener('click', toggleMute);

// ─── INIT ───────────────────────────────────────────────
initOrb();
</script>
