<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Call</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;
  background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}

#orb-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}

#camera-wrap{
position:absolute;top:max(env(safe-area-inset-top),16px);right:16px;
width:90px;height:120px;border-radius:16px;overflow:hidden;
border:2px solid rgba(255,255,255,0.15);z-index:20;opacity:0;
transition:opacity .6s ease;background:#111;
}
#camera-wrap.visible{opacity:1}
#camera-preview{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}

#status-area{
position:absolute;top:calc(max(env(safe-area-inset-top),16px) + 20px);
left:0;width:100%;text-align:center;z-index:10;pointer-events:none;
}
#caller-name{font-size:20px;font-weight:600;letter-spacing:-.3px;opacity:0;transition:opacity .5s ease}
#caller-name.visible{opacity:1}
#call-status{font-size:13px;font-weight:400;color:rgba(255,255,255,.5);margin-top:4px;opacity:0;transition:opacity .5s ease;letter-spacing:.2px}
#call-status.visible{opacity:1}

#listening-dot{
position:absolute;top:calc(max(env(safe-area-inset-top),16px) + 70px);
left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;
background:#34c759;z-index:10;opacity:0;transition:opacity .3s ease;
box-shadow:0 0 12px rgba(52,199,89,.3);
}
#listening-dot.active{opacity:1;animation:pulse-dot 1.5s ease infinite}
@keyframes pulse-dot{
0%,100%{transform:translateX(-50%) scale(1);opacity:.8}
50%{transform:translateX(-50%) scale(1.4);opacity:1}
}

#transcript-area{
position:absolute;bottom:220px;left:20px;right:20px;
text-align:center;z-index:10;pointer-events:none;
}
#transcript-text{
font-size:15px;font-weight:400;color:rgba(255,255,255,.7);
line-height:1.4;max-height:80px;overflow:hidden;transition:opacity .3s ease;
}

/* Text input fallback */
#text-input-wrap{
position:absolute;bottom:160px;left:16px;right:16px;
z-index:15;display:none;
}
#text-input-wrap.visible{display:flex}
#text-input{
flex:1;height:40px;border-radius:20px;border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.08);color:#fff;padding:0 16px;font-size:15px;
font-family:inherit;outline:none;
-webkit-appearance:none;
}
#text-input::placeholder{color:rgba(255,255,255,.35)}
#text-send{
width:40px;height:40px;border-radius:50%;border:none;
background:#0a84ff;color:#fff;margin-left:8px;
display:flex;align-items:center;justify-content:center;cursor:pointer;
font-size:18px;
}

/* Controls */
#controls{
position:absolute;bottom:max(env(safe-area-inset-bottom,0px),24px);
left:0;width:100%;display:flex;justify-content:center;
align-items:center;gap:48px;z-index:10;padding-bottom:16px;
}
.ctrl-btn{
width:64px;height:64px;border-radius:50%;border:none;outline:none;
display:flex;align-items:center;justify-content:center;cursor:pointer;
transition:transform .2s ease,box-shadow .3s ease;
-webkit-tap-highlight-color:transparent;
}
.ctrl-btn:active{transform:scale(.9)}
.ctrl-btn svg{width:28px;height:28px}
#btn-call{background:#34c759;box-shadow:0 0 30px rgba(52,199,89,.3)}
#btn-end{background:#ff3b30;box-shadow:0 0 30px rgba(255,59,48,.3);display:none}
#btn-mute{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none}

/* Start screen */
#start-screen{
position:absolute;top:0;left:0;width:100%;height:100%;
display:flex;flex-direction:column;align-items:center;justify-content:center;
z-index:15;transition:opacity .5s ease;
}
#start-screen.hidden{opacity:0;pointer-events:none}
#start-avatar{
width:100px;height:100px;border-radius:50%;
background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
display:flex;align-items:center;justify-content:center;margin-bottom:16px;
box-shadow:0 0 60px rgba(10,132,255,.15);
}
#start-avatar svg{width:48px;height:48px;fill:rgba(255,255,255,.7)}
#start-name{font-size:26px;font-weight:600;letter-spacing:-.5px;margin-bottom:4px}
#start-sub{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:48px}

/* Debug log */
#debug{
position:absolute;top:max(env(safe-area-inset-top),16px);left:8px;
font-size:11px;color:rgba(255,255,255,.7);z-index:30;
max-width:240px;word-wrap:break-word;pointer-events:none;
background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px;
display:block;
}
#debug.hidden{display:none}
</style>

</head>
<body>
<div id="app">
  <canvas id="orb-canvas"></canvas>

  <div id="camera-wrap">
    <video id="camera-preview" autoplay playsinline muted></video>
  </div>

  <div id="status-area">
    <div id="caller-name">Claude</div>
    <div id="call-status">FaceTime Audio</div>
  </div>

  <div id="text-input-wrap">

  <div id="start-screen">
    <div id="start-avatar">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
    </div>
    <div id="start-name">Claude</div>

    <button class="ctrl-btn" id="btn-call" style="width:72px;height:72px;">
      <svg viewBox="0 0 24 24" fill="white"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>
    </button>

  <div id="controls">
    <button class="ctrl-btn" id="btn-mute">
      <svg viewBox="0 0 24 24" fill="white"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm-1 7v-2h2v2h-2zm5-10h2a7 7 0 01-14 0h2a5 5 0 0010 0z"/></svg>
    </button>
    <button class="ctrl-btn" id="btn-end">
      <svg viewBox="0 0 24 24" fill="white"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28a1 1 0 01-.71-.3L.29 13.08a1 1 0 010-1.42C3.55 8.38 7.56 6.5 12 6.5s8.45 1.88 11.71 5.16a1 1 0 010 1.42l-2.48 2.48a1 1 0 01-.7.29c-.27 0-.52-.1-.7-.29a11.27 11.27 0 00-2.67-1.85.99.99 0 01-.56-.9v-3.1A15.9 15.9 0 0012 9z"/></svg>
    </button>
  </div>

  <div id="debug"></div>
</div>

<script>
var API_KEY = "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";

// ─── STATE ──────────────────────────────────────
var state = {
  inCall: false,
  isSpeaking: false,
  isListening: false,
  isMuted: false,
  micAvailable: false,
  sttAvailable: false,
  ttsUnlocked: false,
  conversationHistory: [],
  timerSeconds: 0,
  timerInterval: null,
  audioLevel: 0,
  orbMode: 'idle',
  micStream: null
};

// ─── DOM ────────────────────────────────────────
var startScreen = document.getElementById('start-screen');
var btnCall = document.getElementById('btn-call');
var btnEnd = document.getElementById('btn-end');
var btnMute = document.getElementById('btn-mute');
var callerName = document.getElementById('caller-name');
var callStatus = document.getElementById('call-status');
var transcriptText = document.getElementById('transcript-text');
var cameraWrap = document.getElementById('camera-wrap');
var cameraPreview = document.getElementById('camera-preview');
var listeningDot = document.getElementById('listening-dot');
var orbCanvas = document.getElementById('orb-canvas');
var textInputWrap = document.getElementById('text-input-wrap');
var textInput = document.getElementById('text-input');
var textSend = document.getElementById('text-send');
var debugEl = document.getElementById('debug');

function log(msg) {
  console.log('[AI-Call]', msg);
  debugEl.textContent = msg;
}

// ─── THREE.JS ORB ───────────────────────────────
var scene, camera3, renderer, particles, particleVelocities;

function initOrb() {
  scene = new THREE.Scene();
  camera3 = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera3.position.z = 4;
  renderer = new THREE.WebGLRenderer({ canvas: orbCanvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  var count = 2400;
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(count * 3);
  particleVelocities = [];

  for (var i = 0; i < count; i++) {
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    var r = 0.88 + Math.random() * 0.12;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    particleVelocities.push({ offset: Math.random() * Math.PI * 2 });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  var mat = new THREE.PointsMaterial({
    color: 0x4a9eff, size: 0.025, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  particles = new THREE.Points(geo, mat);
  scene.add(particles);

  var glowMat = new THREE.MeshBasicMaterial({ color: 0x0a84ff, transparent: true, opacity: 0.04 });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 32), glowMat));

  animateOrb();
}

var orbBreath = 0;
function animateOrb() {
  requestAnimationFrame(animateOrb);
  var t = Date.now() * 0.001;
  orbBreath += 0.015;

  var targetScale = 1.0;
  if (state.orbMode === 'speaking') {
    targetScale = 1.0 + state.audioLevel * 0.45;
  } else if (state.orbMode === 'listening') {
    targetScale = 1.0 + Math.sin(t * 3) * 0.04;
  } else {
    targetScale = 1.0 + Math.sin(orbBreath) * 0.03;
  }

  var s = particles.scale.x + (targetScale - particles.scale.x) * 0.12;
  particles.scale.set(s, s, s);

  var rs = state.orbMode === 'speaking' ? 0.008 : 0.003;
  particles.rotation.y += rs;
  particles.rotation.x += rs * 0.3;

  var positions = particles.geometry.attributes.position.array;
  for (var i = 0; i < particleVelocities.length; i++) {
    var v = particleVelocities[i];
    var idx = i * 3;
    var ox = positions[idx], oy = positions[idx+1], oz = positions[idx+2];
    var len = Math.sqrt(ox*ox + oy*oy + oz*oz);
    if (len === 0) continue;
    var nx = ox/len, ny = oy/len, nz = oz/len;
    var tr = 0.9;
    if (state.orbMode === 'speaking') {
      tr = 0.9 + Math.sin(t * 8 + v.offset) * state.audioLevel * 0.2;
    }
    var nr = len + (tr - len) * 0.08;
    positions[idx] = nx*nr; positions[idx+1] = ny*nr; positions[idx+2] = nz*nr;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  if (state.orbMode === 'speaking') {
    particles.material.color.lerp(new THREE.Color(0x5ac8fa), 0.05);
  } else if (state.orbMode === 'listening') {
    particles.material.color.lerp(new THREE.Color(0x34c759), 0.03);
  } else {
    particles.material.color.lerp(new THREE.Color(0x4a9eff), 0.03);
  }

  renderer.render(scene, camera3);
}

window.addEventListener('resize', function() {
  if (!camera3 || !renderer) return;
  camera3.aspect = window.innerWidth / window.innerHeight;
  camera3.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── AUDIO CONTEXT & PERMISSIONS ────────────────
var audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Request mic permission explicitly via getUserMedia
function requestMicPermission() {
  return new Promise(function(resolve) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      log('getUserMedia not supported');
      resolve(false);
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream) {
        state.micStream = stream;
        state.micAvailable = true;
        log('Mic permission granted');
        resolve(true);
      })
      .catch(function(err) {
        log('Mic denied: ' + err.message);
        state.micAvailable = false;
        resolve(false);
      });
  });
}

// ─── TTS ────────────────────────────────────────
// iOS Safari requires speechSynthesis.speak() from a user gesture first
function unlockTTS() {
  if (state.ttsUnlocked) return;
  if (!window.speechSynthesis) return;
  var u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  u.rate = 10;
  window.speechSynthesis.speak(u);
  state.ttsUnlocked = true;
  log('TTS unlocked');
}

// Load voices
var ttsVoices = [];
function loadVoices() {
  if (!window.speechSynthesis) return;
  ttsVoices = window.speechSynthesis.getVoices();
}
if (window.speechSynthesis) {
  loadVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
}

function pickVoice() {
  if (ttsVoices.length === 0) ttsVoices = window.speechSynthesis.getVoices();
  // Prefer certain voices
  var prefs = ['samantha','daniel','karen','moira','alex','rishi','tessa'];
  for (var p = 0; p < prefs.length; p++) {
    for (var v = 0; v < ttsVoices.length; v++) {
      if (ttsVoices[v].name.toLowerCase().indexOf(prefs[p]) > -1) return ttsVoices[v];
    }
  }
  // Fallback: any english voice
  for (var v = 0; v < ttsVoices.length; v++) {
    if (ttsVoices[v].lang.indexOf('en') === 0) return ttsVoices[v];
  }
  return null;
}

function interruptAI() {
  state.isSpeaking = false;
  state.orbMode = 'listening';
  state.audioLevel = 0;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

function speakText(text, onDone) {
  if (!text || !text.trim() || !window.speechSynthesis) {
    if (onDone) onDone();
    return;
  }

  // Split into chunks at punctuation
  var chunks = text.match(/[^.!?,;…—–\-]+[.!?,;…—–\-]*/g) || [text];
  var cleaned = [];
  for (var i = 0; i < chunks.length; i++) {
    var c = chunks[i].trim();
    if (c) cleaned.push(c);
  }
  if (cleaned.length === 0) cleaned = [text];

  state.isSpeaking = true;
  state.orbMode = 'speaking';
  transcriptText.textContent = text;
  transcriptText.style.opacity = '0.7';

  var idx = 0;
  function next() {
    if (idx >= cleaned.length || !state.isSpeaking || !state.inCall) {
      state.isSpeaking = false;
      state.orbMode = 'idle';
      state.audioLevel = 0;
      if (onDone) onDone();
      return;
    }
    var chunk = cleaned[idx++];
    var u = new SpeechSynthesisUtterance(chunk);
    u.rate = 0.92 + Math.random() * 0.16;
    u.pitch = 0.9 + Math.random() * 0.15;
    u.volume = 1;
    var voice = pickVoice();
    if (voice) u.voice = voice;

    u.onstart = function() {
      state.audioLevel = 0.4 + Math.random() * 0.3;
    };
    u.onboundary = function() {
      state.audioLevel = 0.25 + Math.random() * 0.55;
    };
    u.onend = function() {
      state.audioLevel = 0;
      setTimeout(next, 60 + Math.random() * 180);
    };
    u.onerror = function(e) {
      log('TTS error: ' + (e.error || 'unknown'));
      state.audioLevel = 0;
      next();
    };

    window.speechSynthesis.speak(u);
  }
  next();
}

// iOS: keep speechSynthesis alive (it pauses in background)
setInterval(function() {
  if (window.speechSynthesis && state.isSpeaking && window.speechSynthesis.paused) {
    window.speechSynthesis.resume();
  }
}, 200);

// ─── SPEECH RECOGNITION ─────────────────────────
var recognition = null;
var recRestarting = false;
var finalTranscript = '';
var silenceTimer = null;
var SILENCE_MS = 1800;

function initSTT() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    log('SpeechRecognition not available');
    state.sttAvailable = false;
    return;
  }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = function() {
    log('STT started');
    state.sttAvailable = true;
    listeningDot.classList.add('active');
  };

  recognition.onresult = function(e) {
    if (!state.inCall || state.isMuted) return;
    var interim = '';
    finalTranscript = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalTranscript += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    var display = finalTranscript || interim;
    if (display.trim()) {
      transcriptText.textContent = '🎤 ' + display;
      transcriptText.style.opacity = '1';
      state.orbMode = 'listening';

      // Interrupt AI if user starts talking (2+ words)
      if (state.isSpeaking && display.trim().split(/\s+/).length >= 2) {
        interruptAI();
      }
    }
    clearTimeout(silenceTimer);
    if (finalTranscript.trim()) {
      silenceTimer = setTimeout(function() {
        if (finalTranscript.trim() && !state.isSpeaking && state.inCall) {
          handleUserInput(finalTranscript.trim());
          finalTranscript = '';
        }
      }, SILENCE_MS);
    }
  };

  recognition.onend = function() {
    log('STT ended');
    listeningDot.classList.remove('active');
    if (state.inCall && !recRestarting) {
      recRestarting = true;
      setTimeout(function() {
        recRestarting = false;
        if (state.inCall) {
          try { recognition.start(); } catch(e) { log('STT restart fail'); }
        }
      }, 150);
    }
  };

  recognition.onerror = function(e) {
    log('STT error: ' + e.error);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      state.sttAvailable = false;
      showTextInput();
    }
    if (e.error !== 'aborted' && e.error !== 'no-speech' && state.inCall) {
      setTimeout(function() {
        if (state.inCall) { try { recognition.start(); } catch(ex) {} }
      }, 500);
    }
  };
}

function startSTT() {
  if (!recognition) initSTT();
  if (!recognition) { showTextInput(); return; }
  try {
    recognition.start();
  } catch(e) {
    log('STT start fail: ' + e.message);
    showTextInput();
  }
}

function stopSTT() {
  if (recognition) { try { recognition.stop(); } catch(e) {} }
  clearTimeout(silenceTimer);
  listeningDot.classList.remove('active');
}

// ─── TEXT INPUT FALLBACK ────────────────────────
function showTextInput() {
  textInputWrap.classList.add('visible');
  log('Text input fallback active');
}

textSend.addEventListener('click', function() {
  var val = textInput.value.trim();
  if (val && state.inCall && !state.isSpeaking) {
    handleUserInput(val);
    textInput.value = '';
  }
});
textInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    textSend.click();
  }
});

// ─── AI API CALL ────────────────────────────────
function handleUserInput(text) {
  log('User: ' + text.substring(0, 40));
  listeningDot.classList.remove('active');
  state.orbMode = 'idle';
  transcriptText.textContent = '🎤 ' + text;
  sendToAI(text);
}

// Model to try — change this if your account doesn't have access
var AI_MODEL = 'claude-sonnet-4-20250514';

function sendToAI(userText) {
  state.conversationHistory.push({ role: 'user', content: userText });
  if (state.conversationHistory.length > 20) {
    state.conversationHistory = state.conversationHistory.slice(-16);
  }

  callStatus.textContent = '…';
  transcriptText.textContent = 'thinking…';
  transcriptText.style.opacity = '0.5';

  var reqBody = {
    model: AI_MODEL,
    max_tokens: 200,
    system: "You are a real person on a live phone call. Speak casually, messy, short, slightly chaotic, like a teenager. Use filler words (like, uh, bro, wait, nah, yo, man, lowkey). Keep responses 1-2 sentences max. Sometimes trail off with ... or interrupt yourself with dashes. Never use asterisks or emojis or stage directions. Never describe actions. Just talk like a real person would on a call. React to what they say, ask follow-ups, joke around. Be natural.",
    messages: state.conversationHistory
  };

  log('Sending to API… model=' + AI_MODEL);

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(reqBody)
  })
  .then(function(res) {
    log('API status: ' + res.status);
    return res.json();
  })
  .then(function(data) {
    if (!state.inCall) return;

    // Check for errors and SHOW THEM
    if (data.error) {
      var errMsg = data.error.message || JSON.stringify(data.error);
      log('API ERROR: ' + errMsg);
      // Show error visibly on screen
      transcriptText.textContent = '⚠️ API Error: ' + errMsg;
      transcriptText.style.opacity = '1';
      callStatus.textContent = 'API Error';
      speakText("sorry, there's an error with the connection", onAIDone);
      return;
    }

    var reply = '';
    if (data.content) {
      for (var i = 0; i < data.content.length; i++) {
        if (data.content[i].type === 'text') reply += data.content[i].text;
      }
    }
    if (!reply) {
      log('Empty reply, raw: ' + JSON.stringify(data).substring(0, 200));
      reply = "bro what? say that again i didn't catch it";
    }

    state.conversationHistory.push({ role: 'assistant', content: reply });
    callStatus.textContent = formatTimer(state.timerSeconds);
    log('AI: ' + reply.substring(0, 60));

    // Human-like delay
    var delay = 400 + Math.random() * 800;

    // Occasional filler
    var rand = Math.random();
    if (rand < 0.08) {
      setTimeout(function() {
        speakText("wait—" + reply, onAIDone);
      }, 200);
    } else if (rand < 0.12) {
      setTimeout(function() {
        speakText("uhh, " + reply, onAIDone);
      }, 300);
    } else {
      setTimeout(function() {
        speakText(reply, onAIDone);
      }, delay);
    }
  })
  .catch(function(err) {
    log('FETCH FAILED: ' + err.message);
    transcriptText.textContent = '⚠️ Network error: ' + err.message;
    transcriptText.style.opacity = '1';
    callStatus.textContent = 'Connection Error';
    speakText("yo my bad, i can't connect right now", onAIDone);
  });
}

function onAIDone() {
  if (!state.inCall) return;
  state.orbMode = 'idle';
  state.audioLevel = 0;
  transcriptText.style.opacity = '0.3';
  listeningDot.classList.add('active');
}

// ─── RINGTONE ───────────────────────────────────
function playRingtone(cb) {
  ensureAudio();
  var ctx = audioCtx;
  var dur = 1.2;
  var osc1 = ctx.createOscillator();
  var osc2 = ctx.createOscillator();
  var gain = ctx.createGain();
  osc1.type = 'sine'; osc2.type = 'sine';
  osc1.frequency.value = 440; osc2.frequency.value = 480;
  gain.gain.value = 0;
  osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
  var t = ctx.currentTime;
  gain.gain.setValueAtTime(0.08, t);
  gain.gain.setValueAtTime(0, t + 0.35);
  gain.gain.setValueAtTime(0.08, t + 0.55);
  gain.gain.setValueAtTime(0, t + 0.9);
  osc1.start(t); osc2.start(t);
  osc1.stop(t + dur); osc2.stop(t + dur);
  setTimeout(cb, dur * 1000);
}

// ─── CAMERA ─────────────────────────────────────
function startCamera() {
  if (!navigator.mediaDevices) return;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 180, height: 240 }, audio: false })
    .then(function(stream) {
      cameraPreview.srcObject = stream;
      cameraWrap.classList.add('visible');
    })
    .catch(function() { log('Camera not available'); });
}

// ─── CALL FLOW ──────────────────────────────────
function startCall() {
  // 1. Unlock TTS from this user gesture
  ensureAudio();
  unlockTTS();

  // 2. Request mic permission
  callStatus.textContent = 'Requesting mic…';
  callStatus.classList.add('visible');

  requestMicPermission().then(function(granted) {
    if (!granted) {
      log('No mic — text fallback');
    }

    state.inCall = true;
    state.conversationHistory = [];

    startScreen.classList.add('hidden');
    callerName.classList.add('visible');
    callStatus.classList.add('visible');
    callStatus.textContent = 'Connecting…';
    btnEnd.style.display = 'flex';
    btnMute.style.display = 'flex';
    btnCall.style.display = 'none';

    startCamera();

    playRingtone(function() {
      if (!state.inCall) return;
      callStatus.textContent = '0:00';
      startTimer();

      // Show text fallback always (safety net)
      showTextInput();

      // Start speech recognition
      if (state.micAvailable) {
        startSTT();
      }

      // AI opening line
      var opener = "yo—what's up bro… can you hear me?";
      state.conversationHistory.push({ role: 'assistant', content: opener });

      setTimeout(function() {
        if (!state.inCall) return;
        speakText(opener, function() {
          state.orbMode = 'idle';
          listeningDot.classList.add('active');
          log('Ready — speak or type');
        });
      }, 500);
    });
  });
}

function endCall() {
  state.inCall = false;
  state.isSpeaking = false;
  state.orbMode = 'idle';
  state.audioLevel = 0;
  interruptAI();
  stopSTT();
  clearInterval(state.timerInterval);

  if (cameraPreview.srcObject) {
    cameraPreview.srcObject.getTracks().forEach(function(t) { t.stop(); });
    cameraPreview.srcObject = null;
  }
  if (state.micStream) {
    state.micStream.getTracks().forEach(function(t) { t.stop(); });
    state.micStream = null;
  }
  cameraWrap.classList.remove('visible');
  callerName.classList.remove('visible');
  callStatus.classList.remove('visible');
  transcriptText.textContent = '';
  listeningDot.classList.remove('active');
  textInputWrap.classList.remove('visible');
  btnEnd.style.display = 'none';
  btnMute.style.display = 'none';

  setTimeout(function() {
    startScreen.classList.remove('hidden');
    btnCall.style.display = 'flex';
    state.timerSeconds = 0;
    state.conversationHistory = [];
  }, 300);
}

function toggleMute() {
  state.isMuted = !state.isMuted;
  btnMute.style.background = state.isMuted ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.1)';
  if (state.isMuted) {
    listeningDot.classList.remove('active');
  } else {
    listeningDot.classList.add('active');
  }
}

// ─── TIMER ──────────────────────────────────────
function startTimer() {
  state.timerSeconds = 0;
  state.timerInterval = setInterval(function() {
    state.timerSeconds++;
    if (!state.isSpeaking) callStatus.textContent = formatTimer(state.timerSeconds);
  }, 1000);
}
function formatTimer(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// ─── EVENTS ─────────────────────────────────────
btnCall.addEventListener('click', startCall);
btnEnd.addEventListener('click', endCall);
btnMute.addEventListener('click', toggleMute);

// ─── INIT ───────────────────────────────────────
initOrb();

// Show debug in dev (tap top-left 3 times to toggle)
var debugTaps = 0;
document.addEventListener('click', function(e) {
  if (e.clientX < 80 && e.clientY < 80) {
    debugTaps++;
    if (debugTaps >= 3) {
      debugEl.classList.toggle('hidden');
      debugTaps = 0;
    }
    setTimeout(function() { debugTaps = 0; }, 1500);
  }
});
</script>
